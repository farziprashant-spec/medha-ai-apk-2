name: Build form-fill test APK

on:
  push:
    branches: [form-fill-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Form-Fill-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Form-Fill-Test-APK
          path: Form-Fill-Test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: form-fill-test-${{ github.run_number }}
          name: Form fill test ${{ github.run_number }}
          target_commitish: form-fill-test
          prerelease: true
          body: Test app. Opens government portals inside the app and fills form fields with test values. Never submits anything.
          files: Form-Fill-Test.apk

name: Build Medha AI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npx cap add android

      - continue-on-error: true
        run: npx @capacitor/assets generate --android --assetPath assets

      - run: npx cap sync android

      - working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Medha-AI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Medha-AI-APK
          path: Medha-AI.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Medha AI build ${{ github.run_number }}
          body: Download Medha-AI.apk and install on any Android phone.
          files: Medha-AI.apk
